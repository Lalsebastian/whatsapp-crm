<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chatbot Test Console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 1.2rem; }
  #log { border: 1px solid #333; border-radius: 8px; padding: 1rem; height: 460px; overflow-y: auto; background: #16181d; margin-bottom: 1rem; }
  .msg { margin-bottom: 0.9rem; }
  .msg .who { font-size: 0.75rem; opacity: 0.6; }
  .msg.user .body { color: #8ab4f8; }
  .msg.bot .body { white-space: pre-wrap; }
  .meta { font-size: 0.7rem; opacity: 0.5; margin-top: 2px; white-space: pre-wrap; }
  .options { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
  .option-btn { padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid #2563eb; background: transparent; color: #8ab4f8; cursor: pointer; font-size: 0.85rem; }
  .option-btn:hover { background: #1a2b4d; }
  form { display: flex; gap: 0.5rem; }
  input[type=text] { flex: 1; padding: 0.5rem; border-radius: 6px; border: 1px solid #444; background: #16181d; color: #eee; }
  button[type=submit] { padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  label { font-size: 0.8rem; opacity: 0.7; }
  .hint { font-size: 0.78rem; opacity: 0.55; margin: 0.4rem 0 1rem; }
</style>
</head>
<body>
<h1>Home Services Chatbot — Test Console</h1>
<label>Phone (any string, used as the customer's identity)</label>
<input id="phone" type="text" value="971500000000" style="width:100%;margin-bottom:0.5rem;padding:0.5rem;border-radius:6px;border:1px solid #444;background:#16181d;color:#eee;" />
<p class="hint">Type free text (e.g. "hi", "Nale AC service venam") or tap the buttons the bot sends — both drive the same conversation.</p>
<div id="log"></div>
<form id="form">
  <input id="message" type="text" placeholder="Type a message…" autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const messageInput = document.getElementById('message');
const phoneInput = document.getElementById('phone');

function addMessage(who, body, meta, options) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  const whoEl = document.createElement('div');
  whoEl.className = 'who';
  whoEl.textContent = who === 'user' ? 'You' : 'Bot';
  div.appendChild(whoEl);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'body';
  bodyEl.textContent = body;
  div.appendChild(bodyEl);

  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = meta;
    div.appendChild(metaEl);
  }

  if (options && options.length) {
    const optsEl = document.createElement('div');
    optsEl.className = 'options';
    options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn';
      btn.textContent = opt.title;
      btn.addEventListener('click', () => sendMessage({ buttonId: opt.id, label: opt.title }));
      optsEl.appendChild(btn);
    });
    div.appendChild(optsEl);
  }

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendMessage({ message, buttonId, label }) {
  const phone = phoneInput.value.trim();
  if (!phone) return;

  addMessage('user', label || message);

  try {
    const res = await fetch('/api/chat/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buttonId ? { phone, buttonId } : { phone, message }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMessage('bot', 'Error: ' + (data.detail || data.error || res.statusText));
      return;
    }
    let meta = 'intent=' + data.intent + ' flow=' + data.flow + ' step=' + data.step;
    if (data.debugReason) meta += '\nwhy UNKNOWN: ' + data.debugReason;
    addMessage(
      'bot',
      data.reply || (data.humanTakeover ? '(human takeover active — bot is silent)' : '(no reply)'),
      meta,
      data.options
    );
  } catch (err) {
    addMessage('bot', 'Request failed: ' + err.message);
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = messageInput.value.trim();
  if (!message) return;
  messageInput.value = '';
  sendMessage({ message });
});
</script>
</body>
</html>
