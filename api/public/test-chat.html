<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chatbot Test Console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 1.2rem; }
  #log { border: 1px solid #333; border-radius: 8px; padding: 1rem; height: 460px; overflow-y: auto; background: #16181d; margin-bottom: 1rem; }
  .msg { margin-bottom: 0.9rem; }
  .msg .who { font-size: 0.75rem; opacity: 0.6; }
  .msg.user .body { color: #8ab4f8; }
  .msg.bot .body { white-space: pre-wrap; }
  .meta { font-size: 0.7rem; opacity: 0.5; margin-top: 2px; white-space: pre-wrap; }
  .options { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
  .option-btn { padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid #2563eb; background: transparent; color: #8ab4f8; cursor: pointer; font-size: 0.85rem; }
  .option-btn:hover { background: #1a2b4d; }
  form { display: flex; gap: 0.5rem; }
  input[type=text] { flex: 1; padding: 0.5rem; border-radius: 6px; border: 1px solid #444; background: #16181d; color: #eee; }
  input[type=password] { width: 100%; box-sizing: border-box; margin-bottom: 0.5rem; padding: 0.5rem; border-radius: 6px; border: 1px solid #444; background: #16181d; color: #eee; }
  button[type=submit] { padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  #reset-session { margin: 0 0 0.8rem; padding: 0.45rem 0.8rem; border-radius: 6px; border: 1px solid #dc2626; background: transparent; color: #fca5a5; cursor: pointer; }
  #feedback-tools { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
  #sim-tools { border: 1px solid #333; border-radius: 8px; padding: 0.6rem; margin-bottom: 0.8rem; }
  #sim-tools .row { display: flex; gap: 0.5rem; }
  #scenario { flex: 1; padding: 0.45rem; border-radius: 6px; border: 1px solid #444; background: #16181d; color: #eee; }
  #run-preset { padding: 0.45rem 0.8rem; border-radius: 6px; border: 1px solid #16a34a; background: transparent; color: #86efac; cursor: pointer; }
  #start-feedback { padding: 0.45rem 0.8rem; border-radius: 6px; border: 1px solid #2563eb; background: transparent; color: #8ab4f8; cursor: pointer; }
  button[type=submit]:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
  label { font-size: 0.8rem; opacity: 0.7; }
  .hint { font-size: 0.78rem; opacity: 0.55; margin: 0.4rem 0 1rem; }
  #status { border-radius: 6px; padding: 0.6rem; margin-bottom: 0.8rem; background: #20242c; font-size: 0.85rem; }
  #status.disabled { color: #fca5a5; }
  #status.enabled { color: #86efac; }
</style>
</head>
<body>
<h1>Home Services Chatbot — Test Console</h1>
<div id="status">Checking whether test chat is enabled…</div>
<label for="secret">Developer secret</label>
<input id="secret" type="password" autocomplete="current-password" placeholder="Enter TEST_CHAT_SECRET" />
<label>Phone (any string, used as the customer's identity)</label>
<input id="phone" type="text" value="971500000000" style="width:100%;margin-bottom:0.5rem;padding:0.5rem;border-radius:6px;border:1px solid #444;background:#16181d;color:#eee;" />
<p class="hint">Type free text (e.g. "hi", "Nale AC service venam") or tap the buttons the bot sends — both drive the same conversation.</p>
<button id="reset-session" type="button" hidden>Reset Test Session</button>
<div id="feedback-tools" hidden>
  <input id="feedback-booking-id" type="text" placeholder="Completed booking ID" />
  <button id="start-feedback" type="button">Start Feedback</button>
</div>
<div id="sim-tools" hidden>
  <label for="scenario">Simulation scenario (applies to every message while selected)</label>
  <div class="row">
    <select id="scenario"><option value="">None: real behaviour</option></select>
    <button id="run-preset" type="button">Run Preset</button>
  </div>
  <p class="hint" id="scenario-help">Pick a scenario, then Run Preset to reset the session and send its first message.</p>
</div>
<div id="log"></div>
<form id="form">
  <input id="message" type="text" placeholder="Type a message…" autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const messageInput = document.getElementById('message');
const phoneInput = document.getElementById('phone');
const secretInput = document.getElementById('secret');
const statusEl = document.getElementById('status');
const submitButton = form.querySelector('button[type=submit]');
const resetButton = document.getElementById('reset-session');
const feedbackTools = document.getElementById('feedback-tools');
const feedbackBookingInput = document.getElementById('feedback-booking-id');
const startFeedbackButton = document.getElementById('start-feedback');
const simTools = document.getElementById('sim-tools');
const scenarioSelect = document.getElementById('scenario');
const scenarioHelp = document.getElementById('scenario-help');
const runPresetButton = document.getElementById('run-preset');
let scenarios = [];

function setAvailability(enabled, message) {
  statusEl.textContent = message;
  statusEl.className = enabled ? 'enabled' : 'disabled';
  messageInput.disabled = !enabled;
  submitButton.disabled = !enabled;
  resetButton.hidden = !enabled;
  feedbackTools.hidden = !enabled;
  simTools.hidden = !enabled;
}

async function loadScenarios() {
  const secret = secretInput.value;
  if (!secret || scenarios.length) return;
  try {
    const res = await fetch('/api/chat/test/scenarios', { headers: { 'x-test-chat-secret': secret }, cache: 'no-store' });
    if (!res.ok) return;
    scenarios = (await res.json()).scenarios || [];
    for (const scenario of scenarios) {
      const option = document.createElement('option');
      option.value = scenario.id;
      option.textContent = scenario.label;
      scenarioSelect.appendChild(option);
    }
  } catch (err) {
    scenarioHelp.textContent = 'Could not load scenarios: ' + err.message;
  }
}

secretInput.addEventListener('change', loadScenarios);
scenarioSelect.addEventListener('focus', loadScenarios);
scenarioSelect.addEventListener('change', () => {
  const scenario = scenarios.find((item) => item.id === scenarioSelect.value);
  scenarioHelp.textContent = scenario ? scenario.description : 'Real behaviour: no simulation applied.';
});

async function checkAvailability() {
  try {
    const res = await fetch('/api/chat/test/status', { cache: 'no-store' });
    const data = await res.json();
    if (res.ok && data.enabled) {
      setAvailability(true, 'Test chat is enabled. Enter the developer secret to begin.');
    } else {
      setAvailability(false, 'Test chat is disabled on this deployment.');
    }
  } catch (err) {
    setAvailability(false, 'Unable to check the test-chat status.');
  }
}

function addMessage(who, body, meta, options) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  const whoEl = document.createElement('div');
  whoEl.className = 'who';
  whoEl.textContent = who === 'user' ? 'You' : 'Bot';
  div.appendChild(whoEl);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'body';
  bodyEl.textContent = body;
  div.appendChild(bodyEl);

  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = meta;
    div.appendChild(metaEl);
  }

  if (options && options.length) {
    const optsEl = document.createElement('div');
    optsEl.className = 'options';
    options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn';
      btn.textContent = opt.title;
      btn.addEventListener('click', () => sendMessage({ buttonId: opt.id, label: opt.title }));
      optsEl.appendChild(btn);
    });
    div.appendChild(optsEl);
  }

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendMessage({ message, buttonId, label }) {
  const phone = phoneInput.value.trim();
  if (!phone) return;
  const secret = secretInput.value;
  if (!secret) {
    addMessage('bot', 'Enter the developer secret before sending a test message.');
    return;
  }

  addMessage('user', label || message);

  try {
    const res = await fetch('/api/chat/test', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-test-chat-secret': secret,
      },
      body: JSON.stringify(Object.assign(
        buttonId ? { phone, buttonId } : { phone, message },
        scenarioSelect.value ? { scenario: scenarioSelect.value } : {}
      )),
    });
    const data = await res.json();
    if (!res.ok) {
      if (data.code === 'TEST_CHAT_DISABLED') {
        setAvailability(false, 'Test chat is disabled on this deployment.');
        addMessage('bot', 'Test chat is disabled on this deployment.');
      } else if (data.code === 'TEST_CHAT_UNAUTHORIZED') {
        addMessage('bot', 'The developer secret is invalid.');
      } else {
        addMessage('bot', 'Error: ' + (data.detail || data.error || res.statusText));
      }
      return;
    }
    let meta = (scenarioSelect.value ? '[scenario: ' + scenarioSelect.value + '] ' : '') + 'intent=' + data.intent + ' flow=' + data.flow + ' step=' + data.step + ' confidence=' + data.confidence;
    if (data.service) meta += '\nservice=' + data.service;
    if (data.matchSource) meta += '\nmatch=' + data.matchSource;
    if (data.serviceConfidence !== null) meta += '\nserviceConfidence=' + data.serviceConfidence;
    if (data.changedField) meta += '\nchangedField=' + JSON.stringify(data.changedField);
    if (data.previousValue !== null) meta += '\npreviousValue=' + JSON.stringify(data.previousValue);
    if (data.newValue !== null) meta += '\nnewValue=' + JSON.stringify(data.newValue);
    if (data.handoff) meta += '\nhandoff=true';
    if (data.priority) meta += '\npriority=' + data.priority;
    if (data.handoffReason) meta += '\nreason=' + data.handoffReason;
    if (data.rating !== null) meta += '\nrating=' + data.rating;
    meta += '\nfollowUpRequired=' + data.followUpRequired;
    meta += '\ncomplaintLinked=' + data.complaintLinked;
    if (data.debugReason) meta += '\nwhy UNKNOWN: ' + data.debugReason;
    meta += '\ncustomerId=' + data.customerId;
    meta += '\nreturningCustomer=' + data.returningCustomer;
    meta += '\npreferredLanguage=' + data.preferredLanguage;
    meta += '\ndefaultProperty=' + data.defaultProperty;
    meta += '\nknownFields=' + JSON.stringify(data.knownFields || []);
    meta += '\nmissingFields=' + JSON.stringify(data.missingFields || []);
    meta += '\nambiguousFields=' + JSON.stringify(data.ambiguousFields || []);
    meta += '\nrequiresRevalidation=' + JSON.stringify(data.requiresRevalidation || []);
    meta += '\nroom=' + data.room;
    meta += '\nissue=' + data.issue;
    meta += '\nrecommendedServices=' + JSON.stringify(data.recommendedServices || []);
    meta += '\nserviceabilityFiltered=' + data.serviceabilityFiltered;
    meta += '\nfastPathUsed=' + data.fastPathUsed;
    meta += '\ncustomerTurnCount=' + data.customerTurnCount;
    meta += '\nbotTurnCount=' + data.botTurnCount;
    meta += '\nredundantQuestionsAvoided=' + data.redundantQuestionsAvoided;
    meta += '\nmessageCount=' + JSON.stringify(data.messageCount || {});
    meta += '\nprofileSource=' + data.profileSource;
    if (data.analyticsEvents && data.analyticsEvents.length) {
      meta += '\nevents=' + data.analyticsEvents.map(function (event) { return event.eventType; }).join(', ');
    }
    addMessage(
      'bot',
      data.reply || (data.humanTakeover ? '(human takeover active — bot is silent)' : '(no reply)'),
      meta,
      data.options
    );
  } catch (err) {
    addMessage('bot', 'Request failed: ' + err.message);
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = messageInput.value.trim();
  if (!message) return;
  messageInput.value = '';
  sendMessage({ message });
});

resetButton.addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  const secret = secretInput.value;
  if (!phone || !secret) {
    addMessage('bot', 'Enter the phone identity and developer secret before resetting.');
    return;
  }

  try {
    const res = await fetch('/api/chat/test/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-test-chat-secret': secret },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMessage('bot', data.code === 'TEST_CHAT_UNAUTHORIZED'
        ? 'The developer secret is invalid.'
        : (data.error || 'Unable to reset the test session.'));
      return;
    }
    log.replaceChildren();
    addMessage('bot', data.message || 'Test session reset.');
  } catch (err) {
    addMessage('bot', 'Reset failed: ' + err.message);
  }
});

startFeedbackButton.addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  const bookingId = feedbackBookingInput.value.trim();
  const secret = secretInput.value;
  if (!phone || !bookingId || !secret) {
    addMessage('bot', 'Enter the phone identity, developer secret, and booking ID first.');
    return;
  }
  addMessage('user', 'Start feedback for booking ' + bookingId);
  try {
    const res = await fetch('/api/chat/test/start-feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-test-chat-secret': secret },
      body: JSON.stringify({ phone, bookingId }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMessage('bot', data.error || 'Unable to start feedback.');
      return;
    }
    const meta = 'intent=' + data.intent + ' flow=' + data.flow + ' step=' + data.step
      + '\nrating=' + data.rating + '\nfollowUpRequired=' + data.followUpRequired
      + '\ncomplaintLinked=' + data.complaintLinked;
    addMessage('bot', data.reply || '(no reply)', meta, data.options);
  } catch (err) {
    addMessage('bot', 'Request failed: ' + err.message);
  }
});

async function resetSession(phone, secret) {
  const res = await fetch('/api/chat/test/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-test-chat-secret': secret },
    body: JSON.stringify({ phone }),
  });
  return res.ok;
}

runPresetButton.addEventListener('click', async () => {
  await loadScenarios();
  const scenario = scenarios.find((item) => item.id === scenarioSelect.value);
  const secret = secretInput.value;
  if (!scenario || !secret) {
    addMessage('bot', 'Enter the developer secret and choose a scenario first.');
    return;
  }
  if (scenario.freshPhone) {
    phoneInput.value = '9715' + String(Math.floor(10000000 + Math.random() * 89999999));
  }
  await resetSession(phoneInput.value.trim(), secret);
  log.replaceChildren();
  addMessage('bot', 'Scenario: ' + scenario.label + '. ' + scenario.description);
  await sendMessage({ message: scenario.starter });
});

checkAvailability();
</script>
</body>
</html>
